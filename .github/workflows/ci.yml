name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/vision/requirements.txt
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: python -m pip install -r services/vision/requirements.txt
      - run: python -m unittest discover -s services/vision/tests -p "test_*.py"
